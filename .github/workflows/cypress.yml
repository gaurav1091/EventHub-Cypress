name: Cypress BDD Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke-chrome
            tags: "@smoke"
            browser: chrome
          - name: smoke-electron
            tags: "@smoke"
            browser: electron
          - name: regression-chrome
            tags: "@regression"
            browser: chrome
    env:
      EVENTHUB_BASE_URL: ${{ secrets.EVENTHUB_BASE_URL }}
      EVENTHUB_API_BASE_URL: ${{ secrets.EVENTHUB_API_BASE_URL }}
      EVENTHUB_USER_EMAIL: ${{ secrets.EVENTHUB_USER_EMAIL }}
      EVENTHUB_USER_PASSWORD: ${{ secrets.EVENTHUB_USER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Cypress ${{ matrix.name }} suite
        run: env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="${{ matrix.tags }}" --browser "${{ matrix.browser }}"

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-${{ matrix.name }}
          path: |
            reports
            cypress/screenshots
            cypress/videos
