name: Cypress BDD Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  EVENTHUB_BASE_URL: ${{ secrets.EVENTHUB_BASE_URL }}
  EVENTHUB_API_BASE_URL: ${{ secrets.EVENTHUB_API_BASE_URL }}
  EVENTHUB_USER_EMAIL: ${{ secrets.EVENTHUB_USER_EMAIL }}
  EVENTHUB_USER_PASSWORD: ${{ secrets.EVENTHUB_USER_PASSWORD }}

jobs:
  doctor:
    name: Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=0
          for name in EVENTHUB_BASE_URL EVENTHUB_API_BASE_URL EVENTHUB_USER_EMAIL EVENTHUB_USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing required secret::$name is not configured for this workflow."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run framework doctor
        run: npm run doctor

  lint:
    name: Lint
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  smoke:
    name: Smoke (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: chrome
            browser: chrome
          - name: electron
            browser: electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        run: npm run wait:app

      - name: Run smoke suite
        run: EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-smoke-${{ matrix.name }}" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@smoke" --browser "${{ matrix.browser }}"

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Generate report history summary
        if: always()
        run: npm run report:history

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-smoke-${{ matrix.name }}
          path: |
            reports
            cypress/screenshots
            cypress/videos

  regression:
    name: Regression (${{ matrix.name }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-events
            spec: "cypress/e2e/features/auth/*.feature,cypress/e2e/features/events/*.feature"
          - name: bookings
            spec: "cypress/e2e/features/bookings/*.feature"
          - name: admin
            spec: "cypress/e2e/features/admin/*.feature"
          - name: api-hybrid
            spec: "cypress/e2e/features/api/*.feature,cypress/e2e/features/hybrid/*.feature"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        run: npm run wait:app

      - name: Run regression suite
        run: EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-regression-${{ matrix.name }}" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@regression" --browser chrome --spec "${{ matrix.spec }}"

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Generate report history summary
        if: always()
        run: npm run report:history

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-regression-${{ matrix.name }}
          path: |
            reports
            cypress/screenshots
            cypress/videos

  accessibility:
    name: Accessibility
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        run: npm run wait:app

      - name: Run accessibility suite
        run: EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-accessibility" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@accessibility" --browser chrome --spec "cypress/e2e/features/accessibility/*.feature"

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Generate report history summary
        if: always()
        run: npm run report:history

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-accessibility
          path: |
            reports
            cypress/screenshots
            cypress/videos

  visual:
    name: Visual Smoke
    needs:
      - regression
      - accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        run: npm run wait:app

      - name: Run visual smoke suite
        run: |
          for attempt in 1 2; do
            EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-visual" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@visual" --browser chrome --spec "cypress/e2e/features/visual/*.feature" && exit 0

            if [ "$attempt" -lt 2 ]; then
              echo "Visual smoke failed before completion. Waiting 60 seconds before retrying..."
              sleep 60
            fi
          done

          exit 1

      - name: Compare visual baselines
        if: always()
        run: npm run visual:compare

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Generate report history summary
        if: always()
        run: npm run report:history

      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-visual
          path: |
            reports
            cypress/screenshots
            cypress/videos

  report-summary:
    name: Report Summary
    needs:
      - regression
      - accessibility
      - visual
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cypress-reports-*
          path: combined-artifacts

      - name: List report artifacts
        run: find combined-artifacts -maxdepth 4 -type f | sort

      - name: Generate combined report summary
        run: npm run report:combined

      - name: Upload combined report bundle
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-combined
          path: |
            combined-artifacts
            reports/combined
