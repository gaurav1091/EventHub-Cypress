name: Cypress BDD Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression
          - auth-events
          - bookings
          - admin
          - api-hybrid
          - accessibility
          - visual
      smoke_browser:
        description: Browser for smoke suite
        required: true
        default: all
        type: choice
        options:
          - all
          - chrome
          - electron
      environment:
        description: Target environment profile
        required: true
        default: qa
        type: choice
        options:
          - qa
          - stage
          - prod-smoke
      publish_report:
        description: Publish dashboard to GitHub Pages
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: eventhub-cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EVENTHUB_BASE_URL: ${{ secrets.EVENTHUB_BASE_URL }}
  EVENTHUB_API_BASE_URL: ${{ secrets.EVENTHUB_API_BASE_URL }}
  EVENTHUB_USER_EMAIL: ${{ secrets.EVENTHUB_USER_EMAIL }}
  EVENTHUB_USER_PASSWORD: ${{ secrets.EVENTHUB_USER_PASSWORD }}
  EVENTHUB_ENV: ${{ inputs.environment || 'qa' }}
  EVENTHUB_RUN_SUITE: ${{ inputs.suite || 'auto' }}
  EVENTHUB_RUN_BROWSER: ${{ inputs.smoke_browser || 'matrix' }}
  EVENTHUB_REPORT_PATH: runs/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  doctor:
    name: Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        run: |
          missing=0
          for name in EVENTHUB_BASE_URL EVENTHUB_API_BASE_URL EVENTHUB_USER_EMAIL EVENTHUB_USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing required secret::$name is not configured for this workflow."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run framework doctor
        run: npm run doctor

      - name: Run framework governance doctor
        run: npm run doctor:framework

  lint:
    name: Lint
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  impact:
    name: Impact Analysis
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_regression: ${{ steps.determine-impact.outputs.full_regression }}
      domains: ${{ steps.determine-impact.outputs.domains }}
      specs: ${{ steps.determine-impact.outputs.specs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine impacted tests
        id: determine-impact
        env:
          EVENTHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENTHUB_HEAD_SHA: ${{ github.sha }}
        run: npm run impact:list

      - name: Upload impact report
        uses: actions/upload-artifact@v4
        with:
          name: cypress-impact-analysis
          path: reports/impact

  security:
    name: Security Audit
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run critical dependency audit
        run: npm run security:audit

  docker-smoke:
    name: Docker Smoke
    needs: doctor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Cypress Docker image
        run: npm run docker:build

      - name: Run Docker smoke suite
        run: npm run docker:smoke

      - name: Generate Docker report history summary
        if: always()
        run: npm run report:history

      - name: Upload Docker smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-docker-smoke
          path: |
            reports
            cypress/screenshots
            cypress/videos

  smoke:
    name: Smoke (${{ matrix.name }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'smoke' }}
    needs:
      - lint
      - impact
      - security
      - docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: chrome
            browser: chrome
          - name: electron
            browser: electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.smoke_browser == 'all' || inputs.smoke_browser == matrix.name }}
        run: npm run wait:app

      - name: Run smoke suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.smoke_browser == 'all' || inputs.smoke_browser == matrix.name }}
        run: EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-smoke-${{ matrix.name }}" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@smoke" --browser "${{ matrix.browser }}"

      - name: Generate Cucumber HTML report
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.smoke_browser == 'all' || inputs.smoke_browser == matrix.name) }}
        run: npm run report:html

      - name: Generate report history summary
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.smoke_browser == 'all' || inputs.smoke_browser == matrix.name) }}
        run: npm run report:history

      - name: Upload smoke reports
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.smoke_browser == 'all' || inputs.smoke_browser == matrix.name) }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-smoke-${{ matrix.name }}
          path: |
            reports
            cypress/screenshots
            cypress/videos

  regression:
    name: Regression (${{ matrix.name }})
    needs:
      - smoke
      - impact
    if: ${{ always() && (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'regression' || inputs.suite == 'auth-events' || inputs.suite == 'bookings' || inputs.suite == 'admin' || inputs.suite == 'api-hybrid') || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || needs.impact.outputs.domains != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-events
            spec: "cypress/e2e/features/auth/*.feature,cypress/e2e/features/events/*.feature"
          - name: bookings
            spec: "cypress/e2e/features/bookings/*.feature"
          - name: admin
            spec: "cypress/e2e/features/admin/*.feature"
          - name: api-hybrid
            spec: "cypress/e2e/features/api/*.feature,cypress/e2e/features/hybrid/*.feature"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'regression' || inputs.suite == matrix.name) || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), format(',{0},', matrix.name))) }}
        run: npm run wait:app

      - name: Run regression suite
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'regression' || inputs.suite == matrix.name) || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), format(',{0},', matrix.name))) }}
        run: EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-regression-${{ matrix.name }}" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@regression" --browser chrome --spec "${{ matrix.spec }}"

      - name: Generate Cucumber HTML report
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'regression' || inputs.suite == matrix.name) || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), format(',{0},', matrix.name)))) }}
        run: npm run report:html

      - name: Generate report history summary
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'regression' || inputs.suite == matrix.name) || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), format(',{0},', matrix.name)))) }}
        run: npm run report:history

      - name: Upload regression reports
        if: ${{ always() && (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'regression' || inputs.suite == matrix.name) || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), format(',{0},', matrix.name)))) }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-regression-${{ matrix.name }}
          path: |
            reports
            cypress/screenshots
            cypress/videos

  accessibility:
    name: Accessibility
    needs:
      - smoke
      - impact
    if: ${{ always() && (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'accessibility') || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), ',accessibility,'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        run: npm run wait:app

      - name: Run accessibility suite
        run: EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-accessibility" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@accessibility" --browser chrome --spec "cypress/e2e/features/accessibility/*.feature"

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Generate report history summary
        if: always()
        run: npm run report:history

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-accessibility
          path: |
            reports
            cypress/screenshots
            cypress/videos

  visual:
    name: Visual Smoke
    needs:
      - smoke
      - regression
      - accessibility
      - impact
    if: ${{ always() && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') && (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'visual') || github.event_name == 'push' || github.event_name == 'pull_request' && (needs.impact.outputs.full_regression == 'true' || contains(format(',{0},', needs.impact.outputs.domains), ',visual,'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for EventHub UI
        run: npm run wait:app

      - name: Run visual smoke suite
        run: |
          for attempt in 1 2; do
            EVENTHUB_TEST_DATA_NAMESPACE="ci-${{ github.run_id }}-visual" env -u ELECTRON_RUN_AS_NODE npx cypress run --env tags="@visual" --browser chrome --spec "cypress/e2e/features/visual/*.feature" && exit 0

            if [ "$attempt" -lt 2 ]; then
              echo "Visual smoke failed before completion. Waiting 60 seconds before retrying..."
              sleep 60
            fi
          done

          exit 1

      - name: Compare visual baselines
        if: always()
        run: npm run visual:compare

      - name: Generate Cucumber HTML report
        if: always()
        run: npm run report:html

      - name: Generate report history summary
        if: always()
        run: npm run report:history

      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-visual
          path: |
            reports
            cypress/screenshots
            cypress/videos

  report-summary:
    name: Report Summary
    needs:
      - regression
      - accessibility
      - visual
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore combined report history
        uses: actions/cache@v4
        with:
          path: reports/combined/history.json
          key: eventhub-combined-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eventhub-combined-history-${{ github.ref_name }}-

      - name: Download report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cypress-*
          path: combined-artifacts

      - name: List report artifacts
        run: find combined-artifacts -maxdepth 4 -type f | sort

      - name: Generate combined report summary
        run: npm run report:combined

      - name: Generate combined HTML dashboard
        run: npm run report:dashboard

      - name: Publish GitHub step summary
        if: always()
        run: npm run report:github-summary

      - name: Generate framework inventory
        if: always()
        run: npm run framework:inventory

      - name: Generate PR report comment
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run report:pr-comment

      - name: Upsert PR report comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- eventhub-cypress-report -->";
            const body = fs.readFileSync("reports/combined/pr-comment.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload combined report bundle
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports-combined
          path: |
            combined-artifacts
            reports/combined
            reports/framework-inventory.json
            reports/framework-inventory.md

      - name: Restore published dashboard site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@v4
        with:
          path: site
          key: eventhub-dashboard-site-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            eventhub-dashboard-site-

      - name: Prepare GitHub Pages site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          report_path="${EVENTHUB_REPORT_PATH}"

          mkdir -p "site/$report_path" site/latest
          cp -R reports/combined/. "site/$report_path/"
          cp -R reports/combined/. site/latest/

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=$report_path/">
              <title>EventHub Cypress Report</title>
            </head>
            <body>
              <p><a href="$report_path/">Open this run's Cypress report</a></p>
              <p><a href="latest/">Open latest Cypress report</a></p>
            </body>
          </html>
          EOF

      - name: Save published dashboard site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: site
          key: eventhub-dashboard-site-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_report == 'true') }}
        uses: actions/configure-pages@v5

      - name: Upload dashboard for GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish_report == 'true') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-report-dashboard:
    name: Deploy Report Dashboard
    needs: report-summary
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs['report-summary'].result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_report == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.report-url.outputs.url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      - name: Set run-specific report URL
        id: report-url
        run: echo "url=${{ steps.deploy-pages.outputs.page_url }}${EVENTHUB_REPORT_PATH}/" >> "$GITHUB_OUTPUT"

      - name: Add dashboard links to workflow summary
        run: |
          echo "### Cypress Report Dashboard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open this run's Cypress report](${{ steps.report-url.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open latest Cypress report](${{ steps.deploy-pages.outputs.page_url }}latest/)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report path: \`${EVENTHUB_REPORT_PATH}/\`" >> "$GITHUB_STEP_SUMMARY"
